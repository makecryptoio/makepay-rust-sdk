[package]
name = "makepay"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Official MakePay Rust SDK for payments, donations, invoices, bookkeeping, POS, products, branding, and webhooks."
repository = "https://github.com/makecryptoio/makepay-rust-sdk"
homepage = "https://makepay.io"
documentation = "https://makecrypto.io/documentation/sdk/rust"
readme = "README.md"
keywords = ["makepay", "payments", "webhooks", "invoices", "crypto"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
